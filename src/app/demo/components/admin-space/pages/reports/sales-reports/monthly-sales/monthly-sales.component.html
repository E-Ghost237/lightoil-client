<div class="justify-content-center ml-3 mr-3">
    <table class="table table-striped table-hover table-bordered caption-top">
        <caption class="font-bold text-lg text-dark">Rapport de ventes du mois de ...</caption>      
        <thead class="table-dark">
            <tr class="font-bold text-lg text-uppercase">
                <th scope="col" class="text-center">#</th>
                <th scope="col">Stations-service</th>
                <th scope="col">Produits</th>
                <th scope="col">Total</th>
            </tr>
        </thead>
        <tbody class="table-group-divider" *ngFor="let gas_station of gas_stations; index as i">
            <tr>
                <th scope="row" rowspan="2" class="align-middle">{{ i }}</th>
                <td>
                    <b>{{ gas_station.name }}</b> <br> {{ gas_station.town }}
                </td>
                <td>
                    <table class="table mb-0" *ngFor="let product of products">
                        <tr>
                            <td *ngIf="product.name == 'Super'" style="color: #ba0505;">
                                <strong>{{ product.name }} : </strong>
                            </td>
                            <td *ngIf="product.name == 'Gasoil'" style="color: #1f2422;">
                                <strong>{{ product.name }} : </strong>
                            </td>
                            <td *ngIf="product.name == 'Pétrole' || product.name == 'Petrole'" style="color: #06bd74;">
                                <strong>{{ product.name }} : </strong>
                            </td>
                        </tr>
                    </table>
                </td>
                <td>
                    <table class="table mb-0">
                      <tr>
                        <td>xxx</td>
                      </tr>
                    </table>
                </td>
            </tr>
            <tr class="text-end font-bold text-md">
                <th scope="row" colspan="2" class="pr-4">Total des ventes de la station-service ...</th>
                <td class="pr-4">... FCFA</td>
            </tr>
        </tbody>
        <tfoot class="table-group-divider">
            <tr class="align-middle text-end font-bold text-lg text-uppercase">
                <th scope="row" colspan="3" class="pt-5 pr-4 pb-2">Total des ventes du mois de ...</th>
                <td class="table-info pt-5 pr-4 pb-2">... FCFA</td>
            </tr>
        </tfoot>      
    </table>
</div>
