<!-- Show message -->
<p-toast key="tst"></p-toast>

<div class="sales-perf-page">
    <!-- Header bloc -->
    <div class="card pb-0 mb-4 perf-header-card">
        <div class="card-body grid align-content-center justify-content-between pt-0 xl:pt-3 lg:pt-3">
            <div
                class="col-12 xl:col-7 lg:col-7 md:col-7 text-center xl:text-left align-content-center text-xl text-uppercase xl:mt-3 lg:mt-3 md:mt-3">
                <h1 class="font-bold perf-title">Performances de ventes</h1>
                <p class="perf-subtitle">Indicateurs de performance et tendances multi-periodes du reseau.</p>
            </div>
            <div class="col-12 xl:col-5 lg:col-5 md:col-5 align-content-center xl:pt-0 lg:pt-0">
                <label for="sale-point-types" class="block font-bold text-lg perf-label">Reseau</label>
                <p-dropdown (onChange)="onPointOfSaleTypeChange($event)"
                    styleClass="w-full xl:w-auto lg:w-auto md:w-auto font-bold text-uppercase perf-control" inputId="sale-point-types"
                    [options]="point_of_sale_types" [(ngModel)]="selected_point_of_sale_type" optionLabel="name"
                    [appendTo]="'body'"
                    [virtualScroll]="true" [virtualScrollItemSize]="30" placeholder="Choisir un reseau" />
            </div>
        </div>
    </div>

    <div class="card p-2 pb-2 mb-4 perf-filter-card">
        <div class="card-header font-bold text-xl pt-0">
            <ul class="nav nav-tabs nav-justified card-header-tabs perf-tabs" role="tablist" id="performance-tab">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active text-uppercase" id="daily-tab" data-bs-toggle="tab"
                        data-bs-target="#daily-tab-pane" type="button" role="tab" aria-controls="daily-tab-pane"
                        aria-selected="true" (click)="showCalendar('daily')">
                        Journalieres
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-uppercase" id="weekly-tab" data-bs-toggle="tab"
                        data-bs-target="#weekly-tab-pane" type="button" role="tab" aria-controls="weekly-tab-pane"
                        aria-selected="false" (click)="showCalendar('weekly')">
                        Hebdomadaires
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-uppercase" id="monthly-tab" data-bs-toggle="tab"
                        data-bs-target="#monthly-tab-pane" type="button" role="tab" aria-controls="monthly-tab-pane"
                        aria-selected="false" (click)="showCalendar('monthly')">
                        Mensuelles
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-uppercase" id="annual-tab" data-bs-toggle="tab"
                        data-bs-target="#annual-tab-pane" type="button" role="tab" aria-controls="annual-tab-pane"
                        aria-selected="false" (click)="showCalendar('annual')">
                        Annuelles
                    </button>
                </li>
            </ul>
        </div>
        <div class="card-body justify-content-center">
            <div class="grid mt-1 perf-toolbar">
                <div class="col-12 xl:col-4 lg:col-4 md:col-6">
                    <div *ngIf="is_daily_performances">
                        <label for="daily_date" class="block font-bold mb-1 perf-label">Journee du</label>
                        <p-calendar (onSelect)="onDateSelect($event)" styleClass="w-full perf-control" inputId="daily_date"
                            [appendTo]="'body'"
                            dateFormat="dd/mm/yy" [(ngModel)]="daily_date" [readonlyInput]="true" [showClear]="true"
                            placeholder="Selectionner un jour" [maxDate]="max_date" />
                    </div>

                    <div *ngIf="is_weekly_performances">
                        <label for="weekly_date" class="block font-bold mb-1 perf-label">Semaine du</label>
                        <p-calendar (onSelect)="onDateSelect($event)" styleClass="w-full perf-control" inputId="weekly_date"
                            [appendTo]="'body'"
                            dateFormat="dd/mm/yy" selectionMode="range" [(ngModel)]="weekly_date" [maxDate]="max_date"
                            [readonlyInput]="true" [showClear]="true" placeholder="Selectionner une periode" />
                    </div>

                    <div *ngIf="is_monthly_performances">
                        <label for="monthly_date" class="block font-bold mb-1 perf-label">Mois de</label>
                        <p-calendar (onSelect)="onDateSelect($event)" styleClass="w-full perf-control" inputId="monthly_date"
                            [appendTo]="'body'"
                            dateFormat="mm-yy" view="month" [(ngModel)]="monthly_date" [readonlyInput]="true"
                            [showClear]="true" placeholder="Selectionner un mois" [maxDate]="max_date" />
                    </div>

                    <div *ngIf="is_annual_performances">
                        <label for="annual_date" class="block font-bold mb-1 perf-label">Annee</label>
                        <p-calendar (onSelect)="onDateSelect($event)" styleClass="w-full perf-control" inputId="annual_date"
                            [appendTo]="'body'"
                            dateFormat="yy" view="year" [showClear]="true" [(ngModel)]="annual_date"
                            placeholder="Selectionner une annee" [maxDate]="max_date" />
                    </div>
                </div>

                <div class="col-12 xl:col-2 lg:col-3 md:col-4">
                    <span class="block font-bold mb-1 perf-label">Exporter</span>
                    <p-button (onClick)="exportPerformancesToPDFFormat()"
                        styleClass="w-full align-content-center text-lg perf-export-btn" label="PDF" [raised]="true"
                        severity="danger" [disabled]="!can_export_performances">
                        <img src="assets/img/pdf.png" class="mr-2 pdf-icon" alt="PDF" />
                    </p-button>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="performance-tab-content">
        <div class="tab-pane fade show active" id="daily-tab-pane" role="tabpanel" aria-labelledby="daily-tab"
            tabindex="0">
            <admin-sales-performances-charts [point_of_sale_type]="selected_point_of_sale_type?.name"
                [sales_performances]="daily_sales_performances" period="daily" [loading]="lightoil_loading">
            </admin-sales-performances-charts>
        </div>

        <div class="tab-pane fade" id="weekly-tab-pane" role="tabpanel" aria-labelledby="weekly-tab" tabindex="0">
            <admin-sales-performances-charts [point_of_sale_type]="selected_point_of_sale_type?.name"
                [sales_performances]="weekly_sales_performances" period="weekly" [loading]="lightoil_loading">
            </admin-sales-performances-charts>
        </div>

        <div class="tab-pane fade" id="monthly-tab-pane" role="tabpanel" aria-labelledby="monthly-tab" tabindex="0">
            <div class="perf-coming-soon">Les performances mensuelles seront bientot disponibles.</div>
        </div>

        <div class="tab-pane fade" id="annual-tab-pane" role="tabpanel" aria-labelledby="annual-tab" tabindex="0">
            <div class="perf-coming-soon">Les performances annuelles seront bientot disponibles.</div>
        </div>
    </div>
</div>

<app-chatbot></app-chatbot>
