<ng-container *ngIf="sales_by_product != undefined && sales_by_product.length > 0; else elseTemplate">
    <div class="lo-kpi-grid cols-4">
        <ng-container *ngFor="let product of sales_by_product">
            <div *ngIf="product.name == 'Super'" class="lo-kpi">
                <span class="lo-kpi-icon product">
                    <img src="assets/img/oil/gasoline.png" alt="Super">
                </span>
                <div class="lo-kpi-body">
                    <span class="lo-kpi-label" style="color: #014da4;">Super</span>
                    <div class="lo-kpi-value">
                        {{ (product.volume | number:'1.0-0':'fr') ?? '...' }}<small>Litres</small>
                    </div>
                </div>
            </div>

            <div *ngIf="product.name == 'Gasoil'" class="lo-kpi">
                <span class="lo-kpi-icon product gasoil">
                    <img src="assets/img/oil/diesel.png" alt="Gasoil">
                </span>
                <div class="lo-kpi-body">
                    <span class="lo-kpi-label" style="color: #b98a00;">Gasoil</span>
                    <div class="lo-kpi-value">
                        {{ (product.volume | number:'1.0-0':'fr') ?? '...' }}<small>Litres</small>
                    </div>
                </div>
            </div>

            <div *ngIf="product.name == 'Pétrole'" class="lo-kpi">
                <span class="lo-kpi-icon product petrol">
                    <img src="assets/img/oil/petroleum.png" alt="Pétrole">
                </span>
                <div class="lo-kpi-body">
                    <span class="lo-kpi-label" style="color: #007138;">Pétrole</span>
                    <div class="lo-kpi-value">
                        {{ (product.volume | number:'1.0-0':'fr') ?? '...' }}<small>Litres</small>
                    </div>
                </div>
            </div>
        </ng-container>

        <div class="lo-kpi tone-navy">
            <span class="lo-kpi-icon"><i class="pi pi-wallet"></i></span>
            <div class="lo-kpi-body">
                <span class="lo-kpi-label">Volume total sorti</span>
                <div *ngIf="total_volume != undefined" class="lo-kpi-value">
                    {{ total_volume | number:'1.0-0':'fr' }}<small>Litres</small>
                </div>
            </div>
        </div>
    </div>
</ng-container>

<ng-template #elseTemplate>
    <div class="lo-state">
        <p-progressSpinner strokeWidth="4" [style]="{ width: '2.5rem', height: '2.5rem' }"></p-progressSpinner>
        <p>Chargement des volumes vendus…</p>
    </div>
</ng-template>
