<div class="grid">
    <div class="col-12 xl:col-6 lg:col-6">
        <div class="lo-card chart-card">
            <h3 class="lo-card-title">
                Quantité vendue le {{ formatted_date ?? '...' }} <span class="lo-card-unit">(Litres)</span>
            </h3>
            <ng-container *ngIf="hourly_sales_of_product !== undefined && hourly_sales_of_product.length > 0; else elseTemplate">
                <p-chart type="line" [data]="lineData" [options]="lineOptions"></p-chart>
            </ng-container>
            <ng-template #elseTemplate>
                <div class="lo-state compact">
                    <p-progressSpinner strokeWidth="4" [style]="{ width: '2.25rem', height: '2.25rem' }"></p-progressSpinner>
                    <p>Chargement des ventes horaires…</p>
                </div>
            </ng-template>
        </div>
    </div>

    <div class="col-12 xl:col-6 lg:col-6">
        <div class="lo-card chart-card">
            <h3 class="lo-card-title">
                Ventes sur 10 jours, du {{ formatted_started_date ?? '...' }} au {{ formatted_ended_date ?? '...' }}
                <span class="lo-card-unit">(Litres)</span>
            </h3>
            <ng-container *ngIf="daily_sales_of_product !== undefined && daily_sales_of_product.length > 0; else elseDailyTemplate">
                <p-chart type="bar" [data]="barData" [options]="barOptions"></p-chart>
            </ng-container>
            <ng-template #elseDailyTemplate>
                <div class="lo-state compact">
                    <p-progressSpinner strokeWidth="4" [style]="{ width: '2.25rem', height: '2.25rem' }"></p-progressSpinner>
                    <p>Chargement des ventes journalières…</p>
                </div>
            </ng-template>
        </div>
    </div>
</div>
