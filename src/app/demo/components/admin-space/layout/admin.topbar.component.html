<p-toast></p-toast>

<div class="layout-topbar">
    <button type="button" #menubutton class="p-link layout-menu-button layout-topbar-button mt-2 mr-3"
        (click)="layoutService.onMenuToggle()" title="Afficher / masquer le menu">
        <i class="pi pi-bars"></i>
    </button>

    <a class="layout-topbar-logo" [routerLink]="homeRoute" pTooltip="Retour au tableau de bord" tooltipPosition="bottom">
        <img src="assets/img/logos/lightoil-logo-white.png" alt="LightOil" class="mr-3" />
        <span class="topbar-admin-label">Administration</span>
    </a>

    <button type="button" #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
        (click)="layoutService.showProfileSidebar()" title="Afficher le menu utilisateur">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <button *ngIf="isPlatformSuperAdmin" class="p-link layout-topbar-button"
            (click)="notificationsPanel.toggle($event)"
            pTooltip="Demandes de correction en attente" tooltipPosition="bottom">
            <i *ngIf="pendingAccessRequests?.length" class="pi pi-bell" pBadge [value]="pendingCountLabel" severity="danger"></i>
            <i *ngIf="!pendingAccessRequests?.length" class="pi pi-bell"></i>
            <span>Notifications</span>
        </button>
        <button class="p-link layout-topbar-button topbar-account-btn"
            pTooltip="Mon compte" tooltipPosition="bottom">
            <i class="pi pi-user"></i>
            <span>Compte</span>
        </button>
        <button class="p-link layout-topbar-button topbar-logout-btn" (click)="layoutService.logoutConfirm('top-right')"
            pTooltip="Se déconnecter" tooltipPosition="bottom">
            <i class="pi pi-sign-out"></i>
            <span>Se déconnecter</span>
        </button>
    </div>
</div>

<p-overlayPanel #notificationsPanel [style]="{ width: '24rem' }" appendTo="body" styleClass="admin-notif-panel">
    <div class="admin-notif-head">
        <h6>Demandes de correction</h6>
        <button pButton type="button" icon="pi pi-refresh" class="p-button-sm p-button-text" (click)="loadPendingAccessRequests()" pTooltip="Actualiser"></button>
    </div>

    <div *ngIf="pendingAccessRequests.length === 0" class="lo-state">
        <div class="lo-state-icon"><i class="pi pi-check-circle"></i></div>
        <h4>Rien en attente</h4>
        <p>Aucune demande d'accès en attente.</p>
    </div>

    <div *ngFor="let request of pendingAccessRequests" class="admin-notif-item">
        <div class="admin-notif-station">{{ stationLabel(request) }}</div>
        <div class="admin-notif-meta">
            Demandé par {{ requesterLabel(request) }} le {{ request.created_at | date:'dd/MM/yyyy HH:mm' }}
        </div>
        <div class="admin-notif-actions">
            <button
                pButton
                type="button"
                label="Accorder l'accès"
                icon="pi pi-lock-open"
                class="p-button-sm"
                [loading]="grantingStationId === request.service_station_id"
                (click)="grantFromNotification(request)"
            ></button>
        </div>
    </div>
</p-overlayPanel>
