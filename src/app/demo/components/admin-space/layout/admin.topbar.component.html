<p-toast></p-toast>

<div class="layout-topbar">
    <button type="button" #menubutton class="p-link layout-menu-button layout-topbar-button mt-2 mr-3"
        (click)="layoutService.onMenuToggle()" title="Toggle Menu">
        <i class="pi pi-bars"></i>
    </button>

    <a class="layout-topbar-logo" [routerLink]="homeRoute">
        <img src="assets/img/logos/lightoil-logo-white.png"
            alt="lightoil-logo" class="mr-3" />
        <span class="mt-1 font-bold">Administrateur</span>
    </a>

    <button type="button" #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
        (click)="layoutService.showProfileSidebar()" title="Show Profile Sidebar">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <button *ngIf="isPlatformSuperAdmin" class="p-link layout-topbar-button" (click)="notificationsPanel.toggle($event)">
            <i class="pi pi-bell" [pBadge]="pendingCountLabel" severity="danger"></i>
            <span>Notifications</span>
        </button>
        <button class="p-link layout-topbar-button border-none bg-gray-200 xl:border-circle lg:border-circle">
            <i class="pi pi-user" style="font-size: 1.6rem"></i>
            <span>Compte</span>
        </button>
        <button class="p-link layout-topbar-button text-danger" (click)="layoutService.logoutConfirm('top-right')">
            <i class="pi pi-sign-out"></i>
            <span>Se deconnecter</span>
        </button>
    </div>
</div>

<p-overlayPanel #notificationsPanel [style]="{ width: '380px' }" appendTo="body">
    <div class="flex align-items-center justify-content-between mb-2">
        <h6 class="m-0">Demandes de correction</h6>
        <button pButton type="button" icon="pi pi-refresh" class="p-button-sm p-button-text" (click)="loadPendingAccessRequests()" pTooltip="Actualiser"></button>
    </div>

    <div *ngIf="pendingAccessRequests.length === 0" class="text-500 text-sm p-2">
        Aucune demande d'accès en attente.
    </div>

    <div *ngFor="let request of pendingAccessRequests" class="border-bottom-1 surface-border py-2">
        <div class="text-sm font-semibold">{{ stationLabel(request) }}</div>
        <div class="text-500 text-sm">
            Demandé par {{ requesterLabel(request) }} le {{ request.created_at | date:'dd/MM/yyyy HH:mm' }}
        </div>
        <div class="flex justify-content-end mt-1">
            <button
                pButton
                type="button"
                label="Accorder l'accès"
                icon="pi pi-lock-open"
                class="p-button-sm"
                [loading]="grantingStationId === request.service_station_id"
                (click)="grantFromNotification(request)"
            ></button>
        </div>
    </div>
</p-overlayPanel>
