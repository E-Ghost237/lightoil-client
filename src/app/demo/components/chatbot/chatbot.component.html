<p-card header="" [style]="{ width: '500px' }" *ngIf="showChat" 
    styleClass="z-4 card fixed bottom-0 right-0 flex justify-content-center p-shadow-3 overflow-hidden p-0 mr-5 mb-5">
    <ng-template pTemplate="header">
        <div class="border-round-top bg-blue-500 text-light flex flex-wrap alight-items-center justify-content-between p-2">
            <div class="align-content-start font-semibold text-2xl">Assistance virtuelle</div>
            <div class="align-content-end cursor-pointer">
                <p-button severity="primary" styleClass="border-none border-round bg-blue-500 p-2" (onClick)="toggleChat()">
                    <i class="pi pi-times" style="font-size: 1.3rem"></i>
                </p-button>
            </div>
        </div>
    </ng-template>
    <div class="flex-auto">
        <p-scrollPanel [style]="{ width: '100%', height: '400px' }" styleClass="">
            <div *ngFor="let msg of messages"
                [ngClass]="{'user p-text-right': msg.sender === 'user', 'bot p-text-left': msg.sender === 'bot'}">
                <p class="p-mb-1">{{ msg.text }}</p>
                <div *ngIf="msg.buttons" class="p-mt-2">
                    <p-button *ngFor="let btn of msg.buttons" label="{{ btn }}" (onClick)="selectButton(btn)" />
                </div>
            </div>
        </p-scrollPanel>
    </div>
    <ng-template pTemplate="footer">
        <div class="p-inputgroup">
            <input type="text" #msgInput pInputText placeholder="Poser une question..." autofocus />
            <button pButton type="button" class="border-none border-round-right p-button-primary bg-blue-500 p-2" title="Envoyer"
                (click)="sendMessage(msgInput.value); msgInput.value=''">
                <i class="pi pi-send" style="font-size: 1.8rem"></i>
            </button>
            <!-- <p-button severity="primary" size="large" styleClass="border-none border-round-right bg-blue-500 p-2" 
                (onClick)="sendMessage(msgInput.value); msgInput.value=''">
                <i class="pi pi-send" style="font-size: 2.3rem"></i>
            </p-button> -->
        </div>
    </ng-template>
</p-card>

<p-button *ngIf="!showChat" [rounded]="true" [raised]="true" severity="primary" size="large" 
    styleClass="z-4 fixed bottom-0 right-0 border-none border-circle bg-blue-500 p-2 mr-5 mb-5" (onClick)="toggleChat()">
    <i class="pi pi-comments" style="font-size: 2.3rem"></i>
</p-button>
