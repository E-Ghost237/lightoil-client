<p-toast></p-toast>

<div class="lo-page">
    <div class="lo-page-header">
        <div class="lo-back-title">
            <button type="button" class="lo-icon-action" (click)="backToDshboard()"
                pTooltip="Retour au tableau de bord" tooltipPosition="bottom">
                <i class="pi pi-arrow-left"></i>
            </button>
            <div>
                <span class="lo-eyebrow">Alertes et notifications</span>
                <h1 class="lo-page-title">Suivi des alertes par produit</h1>
                <p class="lo-page-subtitle">Notifications émises par les sondes sur la période</p>
            </div>
        </div>
    </div>

    <div class="lo-filterbar">
        <div class="lo-field">
            <label for="notif-period">Période</label>
            <p-calendar
                inputId="notif-period"
                [(ngModel)]="rangeDates"
                selectionMode="range"
                dateFormat="dd/mm/yy"
                [readonlyInput]="true"
                [showIcon]="true"
                (onSelect)="onDateSelect($event)"
                [maxDate]="maxDate">
            </p-calendar>
        </div>

        <div class="lo-field">
            <label for="notif-product">Produit</label>
            <p-dropdown
                inputId="notif-product"
                [options]="listStationProducts"
                [(ngModel)]="selectedStationProduct"
                [showClear]="true"
                placeholder="Sélectionnez le produit"
                optionLabel="product.name"
                (onChange)="onDropDownChange($event)"
                styleClass="w-full">
                <ng-template pTemplate="selectedItem">
                    <div>{{ selectedStationProduct?.product?.name }}</div>
                </ng-template>
                <ng-template let-stationProduct pTemplate="item">
                    <div>{{ stationProduct?.product?.name }}</div>
                </ng-template>
            </p-dropdown>
        </div>

        <div class="lo-field lo-field--fixed">
            <label aria-hidden="true">&nbsp;</label>
            <button type="button" class="lo-icon-action"
                pTooltip="Exporter les données au format PDF"
                tooltipPosition="bottom"
                (click)="generateProductNotificationPdf()">
                <i class="pi pi-file-pdf" style="color: #dc2626;"></i>
            </button>
        </div>
    </div>

    <div *ngIf="submitted && listNotifications && listNotifications.length > 0">
        <app-table-notification
            [listNotification]="listNotifications"
            [stationProduct]="selectedStationProduct"
            [period]="period">
        </app-table-notification>
    </div>

    <div class="lo-card" *ngIf="submitted && listNotifications && listNotifications.length <= 0">
        <div class="lo-state">
            <div class="lo-state-icon"><i class="pi pi-bell-slash"></i></div>
            <h4>Aucune notification</h4>
            <p>Aucune alerte sur la période sélectionnée. Tout est nominal.</p>
        </div>
    </div>
</div>
