<div *ngIf="listRecord && listRecord?.level?.length > 0">
    <div class="lo-section-head">
        <h3>Graphe des données de la cuve {{tank?.sensor_reference + '-' + tank?.product_service_station?.product?.name}}</h3>
        <span class="lo-section-rule"></span>
    </div>
    <p-chart #graph1 type="line" [data]="data" [options]="options"></p-chart>
</div>
<div *ngIf="listRecord && listRecord?.level?.length <= 0">
    <div class="lo-state">
        <div class="lo-state-icon"><i class="pi pi-chart-line"></i></div>
        <h4>Aucune donnée</h4>
        <p>Aucune donnée disponible dans la période sélectionnée.</p>
    </div>
</div>
