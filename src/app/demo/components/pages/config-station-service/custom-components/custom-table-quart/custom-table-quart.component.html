<div class="card">
    <p-toast></p-toast>
    <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
            <button pButton pRipple label="Nouveau" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
            <button pButton pRipple [label]="Delete" icon="pi pi-trash" class="p-button-danger" (click)="deleteSelectedQuart()" [disabled]="!selectedQuarts || !selectedQuarts.length"></button>
        </ng-template>

        <ng-template pTemplate="right">
            <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" class="mr-2 inline-block"></p-fileUpload>
            <button pButton pRipple label="Export" icon="pi pi-upload" class="p-button-help"></button>
        </ng-template>
    </p-toolbar>

    <p-table
        #dt
        [value]="quarts"
        [rows]="10"
        [paginator]="true"
        [tableStyle]="{ 'min-width': '75rem' }"
        [(selection)]="selectedQuarts"
        [rowHover]="true"
        dataKey="id"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showCurrentPageReport]="true"
    >
        <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
                <h5 class="m-0">Gestion des quarts de travail</h5>
                <span class="p-input-icon-right">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Search..." />
                </span>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 4rem">
                    <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th style="min-width:15rem">#</th>
                <th>Heure d'ouverture</th>
                <th>Heure de cloture</th>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-quart let-rowData let-columns="columns" let-rowIndex="rowIndex">
            <tr>
                <td>
                    <p-tableCheckbox [value]="quart"></p-tableCheckbox>
                </td>
                <td>{{ rowIndex+1 }}</td>
                <td>{{ quart.time_start }}</td>
                <td>{{ quart.time_close }}</td>
                <td>
                    <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editQuart(quart)"></button>
                    <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteQuart(quart)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="summary">
            <div class="flex align-items-center justify-content-between">
                Au total il y'a {{ quarts ? quarts.length : 0 }} quarts de travail.</div>
        </ng-template>
    </p-table>
</div>
<p-dialog 
    [(visible)]="quartDialog" 
    [style]="{ width: '450px' }" 
    header="Details du quart de travail" 
    [modal]="true" 
    appendTo="body"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <div class="field mt-4">
            <span class="p-float-label">
                <p-dropdown 
                    [options]="listHours" 
                    [(ngModel)]="quart.time_start" 
                    placeholder="Selectionnez une heure"
                    appendTo="body" 
                    inputId="float-label">
                </p-dropdown>
                <label for="float-label">Selectionnez l'heure d'ouverture</label>
            </span>
            <small class="p-error" *ngIf="submitted && quart.time_start.length <= 0">L'heure d'ouverture est requise.</small>
        </div>
        <div class="field mt-4">
            <span class="p-float-label">
                <p-dropdown 
                    [options]="listHours" 
                    [(ngModel)]="quart.time_close" 
                    placeholder="Selectionnez une heure" 
                    appendTo="body" 
                    inputId="float-label">
                </p-dropdown>
                <label for="float-label">Selectionnez l'heure de cloture</label>
            </span>
            <small class="p-error" *ngIf="submitted && quart.time_close.length <= 0">L'heure de cloture est requise.</small>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Annuler" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Sauvegarder" icon="pi pi-check" class="p-button-text" (click)="saveQuart()"></button>
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }" [acceptLabel]="'Oui'" [rejectLabel]="'Non'">
</p-confirmDialog>
