<p-toast></p-toast>

<div class="lo-page">
    <div class="lo-page-header">
        <div class="lo-back-title">
            <button type="button" class="lo-icon-action" (click)="backToDshboard()"
                pTooltip="Retour au tableau de bord" tooltipPosition="bottom">
                <i class="pi pi-arrow-left"></i>
            </button>
            <div>
                <span class="lo-eyebrow">Configuration · Station service</span>
                <h1 class="lo-page-title">Image de fond</h1>
                <p class="lo-page-subtitle">Personnalisez l'arrière-plan de votre espace de travail</p>
            </div>
        </div>
    </div>

    <div class="lo-card">
        <h3 class="lo-card-title">Téléverser une image</h3>
        <p class="lo-card-subtitle">Format image accepté. Elle sera appliquée comme fond de la plateforme.</p>
        <p-fileUpload name="demo[]" #uploader
            [url]="urlSetImage"
            (onSelect)="onSelectedFile($event)"
            (uploadHandler)="onCustomUpload($event)"
            chooseLabel="Choisir une image"
            uploadLabel="Charger l'image"
            cancelLabel="Annuler"
            [multiple]="false"
            [customUpload]="true"
            previewWidth="100"
            method="post"
            accept="image/*"
            maxFileSize="1000000000">
            <ng-template pTemplate="content">
                <ul *ngIf="uploadedFiles.length">
                    <li *ngFor="let file of uploadedFiles">{{ file.name }} - {{ file.size }} bytes</li>
                </ul>
            </ng-template>
        </p-fileUpload>
    </div>
</div>
