<p-toast></p-toast>
<div class="row bg-secondary justify-content-evenly" >
    <div class="col">
        <button class="bg-secondary" style="border: none;">
            <i class="pi pi-arrow-left" (click)="backToDshboard()"></i>
        </button>
    </div>
    <div class="col-8 text-center">
        <h4 class="text-white">Reconciliation des index de pompes avec les sorties de cuve</h4>
    </div>
    <div class="col text-center">
        <img src="assets/demo/images/image_pistolet-removebg-preview.png" alt="icon">
    </div>
</div>

<div class="card flex  flex-row justify-content-evenly mt-3 text-white" >
    <div class="w-30rem">
        <span class="p-float-label">
            <p-calendar
                [(ngModel)]="rangeDates"
                selectionMode="range"
                dateFormat="dd/mm/yy"
                [readonlyInput]="true"
                [showIcon]="true"
                (onSelect)="onDateSelect($event)"
                [maxDate]="maxDate"
                inputStyleClass="w-100"
                styleClass="w-100"
                >
            </p-calendar>
            <label for="float-label text-white">Selectionnez la date ou la periode</label>
        </span>

    </div>

    <div class="">
        <span class="p-float-label">
            <p-dropdown
                [options]="listQuartWorkings"
                [(ngModel)]="selectedQuartWorking"
                [showClear]="true"
                placeholder="Selectionnez le quart de travail"
                optionLabel="time_start" inputId="float-label"
                (onChange)="onDropDownQuartWorkingChange($event)"
                [styleClass]="'w-100'"
            >
            <ng-template pTemplate="selectedItem">
                <div>
                    {{ 
                        selectedQuartWorking ? selectedQuartWorking?.time_start+'-'+selectedQuartWorking?.time_close : '' 
                    }}
                </div>
            </ng-template>
            <ng-template let-quartWorking pTemplate="item">
                <div>
                    {{ 
                        quartWorking?.time_start+'-'+quartWorking?.time_close
                    }}
                </div>
            </ng-template>
            </p-dropdown>
            <label for="float-label">Selectionnez le quart de travail</label>
        </span>
    </div>

    <div class="">
        <span class="p-float-label">
            <p-dropdown
                [options]="listProducts"
                [(ngModel)]="selectedProduct"
                [showClear]="true"
                placeholder="Selectionnez le produit"
                optionLabel="name" inputId="float-label"
                (onChange)="onDropDownProductChange($event)"
                [styleClass]="'w-100'"
            >
            <ng-template pTemplate="selectedItem">

                <div>{{ selectedProduct ? selectedProduct?.name : '' }}</div>

            </ng-template>
            <ng-template let-product pTemplate="item">
                <div>{{ product?.name }}</div>
            </ng-template>
            </p-dropdown>
            <label for="float-label">Selectionnez le produit</label>
        </span>
    </div>

    <div class="">
        <!-- <button class="">
            <i class=" pi pi-file-excel" style="font-size: 2.5rem; color: rgb(118, 237, 82);"></i>
        </button> -->
        <p-button 
            pRipple 
            icon="pi pi-file-pdf" 
            class="mr-2" 
            [rounded]="true" 
            [outlined]="true" 
            [disabled]="activeExport"
            severity="danger" 
            pTooltip="exporter les données au format pdf" 
            (click)="generateProductReconciliationIndicesPdf()" />
        
    </div>
</div>

<div class="card">
    <app-table-reconciliation> </app-table-reconciliation>
</div>
