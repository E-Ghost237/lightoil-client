<p-toast></p-toast>

<div class="lo-page">
    <div class="lo-page-header">
        <div class="lo-back-title">
            <button type="button" class="lo-icon-action" (click)="backToDshboard()"
                pTooltip="Retour au tableau de bord" tooltipPosition="bottom">
                <i class="pi pi-arrow-left"></i>
            </button>
            <div>
                <span class="lo-eyebrow">Historiques par produit</span>
                <h1 class="lo-page-title">Jauges</h1>
                <p class="lo-page-subtitle">Relevés consolidés du produit sur la période sélectionnée</p>
            </div>
        </div>
    </div>

    <div class="lo-filterbar">
        <div class="lo-field">
            <label for="hbp-tank-period">Période</label>
            <p-calendar
                inputId="hbp-tank-period"
                [(ngModel)]="rangeDates"
                selectionMode="range"
                dateFormat="dd/mm/yy"
                [readonlyInput]="true"
                [showIcon]="true"
                (onSelect)="onDateSelect($event)"
                [maxDate]="maxDate">
            </p-calendar>
        </div>

        <div class="lo-field">
            <label for="hbp-tank-select">Produit</label>
            <p-dropdown
                inputId="hbp-tank-select"
                [options]="listStationProducts"
                [(ngModel)]="selectedStationProduct"
                [showClear]="true"
                placeholder="Sélectionnez le produit"
                optionLabel="product.name"
                (onChange)="onDropDownChange($event)"
                styleClass="w-full">
                <ng-template pTemplate="selectedItem">
                    <div>{{ selectedStationProduct?.product?.name }}</div>
                </ng-template>
                <ng-template let-stationProduct pTemplate="item">
                    <div>{{ stationProduct?.product?.name }}</div>
                </ng-template>
            </p-dropdown>
        </div>

        <div class="lo-field lo-field--fixed">
            <label aria-hidden="true">&nbsp;</label>
            <button type="button" class="lo-icon-action"
                pTooltip="Exporter les données au format PDF"
                tooltipPosition="bottom"
                (click)="generateTankProductPdf()">
                <i class="pi pi-file-pdf" style="color: #dc2626;"></i>
            </button>
        </div>
    </div>

    <div *ngIf="listRecords && listRecords?.length > 0">
        <app-hbp-custom-table-tank [listRecord]="listRecords" [stationProduct]="selectedStationProduct" [period]="period">
        </app-hbp-custom-table-tank>
    </div>

    <div class="lo-card" *ngIf="listRecords && listRecords?.length <= 0">
        <div class="lo-state">
            <div class="lo-state-icon"><i class="pi pi-database"></i></div>
            <h4>Aucune donnée</h4>
            <p>Aucune donnée disponible dans la période sélectionnée.</p>
        </div>
    </div>
</div>

<!-- Chatbot -->
<app-chatbot></app-chatbot>
