
<p-toast></p-toast>
<div class="row bg-secondary justify-content-evenly" >
    <div class="col">
        <button class="bg-secondary" style="border: none;">
            <i class="pi pi-arrow-left" (click)="backToDshboard()"></i>
        </button>
    </div>
    <div class="col-8 text-center">
        <h4 class="text-white">Historique des donnees par produit</h4>
    </div>
    <div class="col text-center">
        <img src="assets/demo/images/70-2-xl-rbg.png" alt="icon">
    </div>
</div>

<div class="card mt-2 text-white p-2" >
    <div class="row justify-content-evenly gap-2 ">
        <div class="offset-2 col">
            <span class="p-float-label">
                <p-calendar
                    [(ngModel)]="rangeDates"
                    selectionMode="range"
                    dateFormat="dd/mm/yy"
                    [readonlyInput]="true"
                    [showIcon]="true"
                    (onSelect)="onDateSelect($event)"
                    [maxDate]="maxDate"
                    >
                </p-calendar>
                <label for="float-label text-white">Selectionnez la periode</label>
            </span>
        </div>
    
        <div class="col">
            <span class="p-float-label">
                <p-dropdown
                    [options]="listStationProducts"
                    [(ngModel)]="selectedStationProduct"
                    [showClear]="true"
                    placeholder="Selectionnez le produit"
                    optionLabel="product.name" inputId="float-label"
                    (onChange)="onDropDownChange($event)"
                    [styleClass]="'w-100'"
                >
                <ng-template pTemplate="selectedItem">
                    <div>{{ selectedStationProduct?.product?.name }}</div>
                </ng-template>
                <ng-template let-stationProduct pTemplate="item">
                    <div>{{ stationProduct?.product?.name }}</div>
                </ng-template>
                </p-dropdown>
                <label for="float-label">Selectionnez le produit</label>
            </span>
        </div>
        <div class="col-2 border-round">
            <!-- <button class="">
                <i class=" pi pi-file-excel" style="font-size: 2.5rem; color: rgb(118, 237, 82);"></i>
            </button> -->
            <button class=""
                pTooltip="exporter les données au format pdf" 
                (click)="generateTankProductPdf()">
                <i class=" pi pi-file-pdf" style="font-size: 2.5rem; color: red;"></i>
            </button>
        </div>
    </div>
</div>

<div class="row" *ngIf="listRecords && listRecords?.length > 0">
    <app-hbp-custom-table-tank [listRecord] = "listRecords" [stationProduct] = "selectedStationProduct" [period]="period">
    </app-hbp-custom-table-tank>
</div>
<div class="row justify-content-center" *ngIf="listRecords && listRecords?.length <= 0">
    <div class="col text-center">
        Aucune données disponible dans la période
    </div>
</div>

<!-- Chatbot -->
<app-chatbot></app-chatbot>
