<p-toast></p-toast>

<div class="lo-page">
    <div class="lo-page-header">
        <div class="lo-back-title">
            <button type="button" class="lo-icon-action" (click)="backToDshboard()"
                pTooltip="Retour au tableau de bord" tooltipPosition="bottom">
                <i class="pi pi-arrow-left"></i>
            </button>
            <div>
                <span class="lo-eyebrow">Historiques par produit</span>
                <h1 class="lo-page-title">Graphe d'évolution</h1>
                <p class="lo-page-subtitle">Évolution du produit sur la période sélectionnée</p>
            </div>
        </div>
    </div>

    <div class="lo-filterbar">
        <div class="lo-field">
            <label for="hbp-graph-period">Période</label>
            <p-calendar
                inputId="hbp-graph-period"
                [(ngModel)]="rangeDates"
                selectionMode="range"
                dateFormat="dd/mm/yy"
                [readonlyInput]="true"
                [showIcon]="true"
                (onSelect)="onDateSelect($event)"
                [maxDate]="maxDate">
            </p-calendar>
        </div>

        <div class="lo-field">
            <label for="hbp-graph-select">Produit</label>
            <p-dropdown
                inputId="hbp-graph-select"
                [options]="listStationProducts"
                [(ngModel)]="selectedStationProduct"
                [showClear]="true"
                placeholder="Sélectionnez le produit"
                optionLabel="product.name"
                (onChange)="onDropDownChange($event)"
                styleClass="w-full">
                <ng-template pTemplate="selectedItem">
                    <div>{{ selectedStationProduct?.product?.name }}</div>
                </ng-template>
                <ng-template let-stationProduct pTemplate="item">
                    <div>{{ stationProduct?.product?.name }}</div>
                </ng-template>
            </p-dropdown>
        </div>

        <div class="lo-field lo-field--fixed">
            <label aria-hidden="true">&nbsp;</label>
            <button type="button" class="lo-icon-action"
                pTooltip="Exporter le graphe"
                tooltipPosition="bottom"
                (click)="generateTankProductGraphPdf()">
                <i class="pi pi-image" style="color: #059669;"></i>
            </button>
        </div>
    </div>

    <div class="lo-card">
        <app-hbp-custom-graph></app-hbp-custom-graph>
    </div>
</div>

<!-- Chatbot -->
<app-chatbot></app-chatbot>
