<div class="lo-page tank-list-page">
    <ng-container *ngIf="dashboardData?.length > 0; else elseTemplate">
        <p-toast></p-toast>

        <div class="lo-page-header">
            <div>
                <span class="lo-eyebrow">Monitoring temps réel</span>
                <h1 class="lo-page-title">Tableau de bord des cuves</h1>
                <p class="lo-page-subtitle">Cliquez sur une cuve pour le détail · {{d}}</p>
            </div>
            <div class="lo-page-actions">
                <span class="lo-chip navy">
                    <i class="pi pi-database"></i>
                    {{getBigTotalOfTank()}} cuve(s)
                </span>
            </div>
        </div>

        <app-tank-list-by-type *ngFor="let dashboardDataType of exempleDashBoardData" [listTank]="dashboardDataType">
        </app-tank-list-by-type>

        <app-chatbot></app-chatbot>
    </ng-container>

    <ng-template #elseTemplate>
        <div class="report-loading-state">
            <img width="150" src="../../../../../assets/layout/images/logo.gif" alt="Chargement...">
            <p>Chargement des cuves en cours...</p>
        </div>
    </ng-template>
</div>
