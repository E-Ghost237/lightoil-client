<div class="tank-card-head">
    <span class="lo-dot" [ngClass]="getOnlineStatuSensor() ? 'live' : 'idle'"
        [pTooltip]="getOnlineStatuSensor() ? 'Jauge active' : 'Jauge inactive'"
        tooltipPosition="bottom"></span>
    <div class="tank-card-title">
        <strong>Cuve {{dataFromTankList?.tank?.sensor_reference}}</strong>
        <span class="tank-card-product">{{dataFromTankList?.product?.name}}</span>
    </div>
    <span class="lo-chip" [ngClass]="getTotalNotification() > 0 ? 'warn' : 'offline'"
        pTooltip="Notifications de la journée" tooltipPosition="bottom">
        <i class="pi pi-bell"></i>
        {{getTotalNotification()}}
    </span>
</div>
<div class="tank-card-alert" *ngIf="getDepMessage()">
    <i class="pi pi-exclamation-circle"></i>
    <span>{{getDepMessage()}}</span>
</div>
