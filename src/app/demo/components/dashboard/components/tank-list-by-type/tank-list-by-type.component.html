<div class="lo-section">
    <div class="lo-section-head">
        <h3>{{listTank?.type?.name || 'Cuves'}}</h3>
        <span class="lo-section-rule"></span>
        <span class="lo-chip navy">
            <i class="pi pi-database"></i>
            {{listTank?.data?.length}} capteur{{(listTank?.data?.length ?? 0) > 1 ? 's' : ''}}
        </span>
    </div>

    <div class="tank-grid">
        <article class="tank-card lo-rise"
            *ngFor="let tankData of listTank?.data; index as i;"
            [style.animation-delay]="(i * 60) + 'ms'"
            (click)="listTank?.type?.code == 'Debimetre' ?
                    goToFlowMeterInfo(tankData.tank.id, tankData)
                    : goToTankInfo(tankData.tank.id, tankData)">
            <app-tank-header [dataFromTankList]="tankData"></app-tank-header>
            <app-tank-image
                [dataFromTankList]="tankData"
                [type]="listTank?.type?.code == 'Debimetre' ?
                        'Debimetre'
                        : 'sonde'">
            </app-tank-image>
            <span class="tank-card-cta">
                Voir le détail
                <i class="pi pi-arrow-right"></i>
            </span>
        </article>
    </div>
</div>
